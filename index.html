    <script>
      (function () {
        try {
          var saved = localStorage.getItem('elitec_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
